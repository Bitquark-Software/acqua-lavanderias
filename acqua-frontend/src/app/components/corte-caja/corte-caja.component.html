<app-drawer class="space-y-4">
    <div class="w-full md:w-10/12 my-5 mx-auto p-0">
        <div class="card shadow-md">
            <button
                class="btn bg-teal-600 hover:bg-teal-500 text-white w-8/10 md:w-1/2 lg:w-2/5 xl:w-1/3 rounded m-4"
                (click)="requestGetProfitsFromCashierReconciliation('modal_id_caja', 'modal_continuar_operacion', 'modal_error')"
            >
                <svg
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path class="fill-current" d="M12 2c5.514 0 10 4.486 10 10s-4.486 10-10 10-10-4.486-10-10 4.486-10 10-10zm0-2c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm4 14.083c0-2.145-2.232-2.742-3.943-3.546-1.039-.54-.908-1.829.581-1.916.826-.05 1.675.195 2.443.465l.362-1.647c-.907-.276-1.719-.402-2.443-.421v-1.018h-1v1.067c-1.945.267-2.984 1.487-2.984 2.85 0 2.438 2.847 2.81 3.778 3.243 1.27.568 1.035 1.75-.114 2.011-.997.226-2.269-.168-3.225-.54l-.455 1.644c.894.462 1.965.708 3 .727v.998h1v-1.053c1.657-.232 3.002-1.146 3-2.864z"/>
                </svg>
                Mostrar ganancias de la caja
            </button>
            <button
                class="btn bg-teal-600 hover:bg-teal-500 text-white w-8/10 md:w-1/2 lg:w-2/5 xl:w-1/3 rounded m-4"
                (click)="getCashierReconciliation()"
            >
                <svg
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path class="fill-current" d="M7 22v-16h14v7.543c0 4.107-6 2.457-6 2.457s1.518 6-2.638 6h-5.362zm16-7.614v-10.386h-18v20h8.189c3.163 0 9.811-7.223 9.811-9.614zm-10 1.614h-4v-1h4v1zm6-4h-10v1h10v-1zm0-3h-10v1h10v-1zm1-7h-17v19h-2v-21h19v2z"/>
                </svg>
                Mostrar todos los cortes de caja
            </button>
          <!-- MODALES PARA INGRESAR DATOS -->
          <dialog id="modal_id_caja" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4">Ingrese el ID de la caja: </p>
              <input id="id_caja_input" [(ngModel)]="id_caja" placeholder="Debe ser mayor a cero..." type="text" class="input w-full mt-2">
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-indigo-600 m-2" (click)="closeModal('modal_id_caja')" [disabled]="isInputEmpty('id_caja_input')">
                    Continuar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
          <dialog id="modal_monto" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4">Ingrese el monto: </p>
              <input id="monto_input" [(ngModel)]="monto" placeholder="Debe ser mayor a cero..." type="text" class="input w-full mt-2">
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-indigo-600 m-2" (click)="closeModal('modal_monto')" [disabled]="isInputEmpty('monto_input')">
                    Continuar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
          <dialog id="modal_codigo_admin" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4">Ingrese el código administrador: </p>
              <input id="codigo_admin_input" [(ngModel)]="codigo_admin" placeholder="Código Administrador..." type="text" class="input w-full mt-2">
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-indigo-600 m-2" (click)="closeModal('modal_codigo_admin')" [disabled]="isInputEmpty('codigo_admin_input')">
                    Continuar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
          <ng-container>
            <app-modal-ganancias-caja
              [current_process]="name_current_process"
              [ganancias_caja]="ganancias_caja"
              [ganancias_caja_anticipos]="ganancias_caja_anticipos"
            ></app-modal-ganancias-caja>
          </ng-container>
          <!-- MODALES PARA MOSTRAR MENSAJES -->
          <dialog id="modal_continuar_operacion" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4"><br />¿Desea continuar?</p>
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-teal-600 mr-2" (click)="continuarOperacion('modal_success', 'modal_error')">
                    Si
                  </button>
                  <button class="btn text-white bg-orange-600 m-2" (click)="closeModal('modal_continuar_operacion')">
                    Cancelar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
          <dialog id="modal_success" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4"><br />{{msg_success}}</p>
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-teal-600 m-2" (click)="closeModal('modal_success')">
                    Aceptar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
          <dialog id="modal_error" class="modal" hidden>
            <div class="modal-box">
              <h3 class="font-bold text-lg">{{name_current_process}}</h3>
              <p class="py-4"><br />{{msg_error}}</p>
              <div class="modal-action">
                <form method="dialog">
                  <button class="btn text-white bg-orange-600 m-2" (click)="closeModal('modal_error')">
                    Aceptar
                  </button>
                </form>
              </div>
            </div>
          </dialog>
        </div>
    </div>
</app-drawer>
